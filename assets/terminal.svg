<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="370">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Terminal Window Frame -->
  <g filter="url(#shadow)">
    <!-- Body Background -->
    <rect x="15" y="15" width="770" height="340" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

    <!-- Header / Title Bar -->
    <path d="M 15 27 Q 15 15 27 15 L 773 15 Q 785 15 785 27 L 785 52 L 15 52 Z" fill="url(#headerGrad)"/>
    <line x1="15" y1="52" x2="785" y2="52" stroke="#30363d" stroke-width="1"/>

    <!-- Mac Window Control Buttons -->
    <circle cx="40" cy="34" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="60" cy="34" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="80" cy="34" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Terminal Title -->
    <text x="400" y="38" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">dal@infrastructure: ~ (zsh)</text>
  </g>

  <!-- Terminal Content Lines -->
  <g font-family="'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, Monaco, monospace" font-size="13.5" xml:space="preserve">
    <!-- Prompt line -->
    <text x="40" y="85">
      <tspan fill="#38bdf8" font-weight="bold">➜</tspan>
      <tspan fill="#a78bfa" font-weight="bold"> ~</tspan>
      <tspan fill="#7dd3fc"> cat profile.yml</tspan>
    </text>

    <!-- Code Body -->
    <text x="40" y="115">
      <tspan fill="#7ee787">dalroot</tspan><tspan fill="#8b949e">:</tspan>
    </text>

    <text x="60" y="140">
      <tspan fill="#79c0ff">role</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Systems &amp; Network Infrastructure Engineer"</tspan>
    </text>

    <text x="60" y="165">
      <tspan fill="#79c0ff">languages</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#ff7b72">Go</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ff7b72">Python</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ff7b72">TypeScript</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ff7b72">Dart</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ff7b72">Kotlin</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#ff7b72">Bash</tspan><tspan fill="#8b949e">]</tspan>
    </text>

    <text x="60" y="190">
      <tspan fill="#79c0ff">runtimes</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#d2a8ff">Linux Kernel</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#d2a8ff">sing-box</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#d2a8ff">Docker</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#d2a8ff">Android VpnService</tspan><tspan fill="#8b949e">]</tspan>
    </text>

    <text x="60" y="220">
      <tspan fill="#79c0ff">focus_areas</tspan><tspan fill="#8b949e">:</tspan>
    </text>

    <text x="80" y="245">
      <tspan fill="#8b949e">- </tspan><tspan fill="#f0883e">"Low-latency WebSockets with sub-5ms deterministic execution (REX)"</tspan>
    </text>

    <text x="80" y="270">
      <tspan fill="#8b949e">- </tspan><tspan fill="#f0883e">"Censorship-resilient multiplexing panels &amp; zero-dependency tunnels (Hawal)"</tspan>
    </text>

    <text x="80" y="295">
      <tspan fill="#8b949e">- </tspan><tspan fill="#f0883e">"Cross-platform runtime recovery &amp; offline sanction bypassers (Antigravity Cleaner)"</tspan>
    </text>

    <text x="80" y="320">
      <tspan fill="#8b949e">- </tspan><tspan fill="#f0883e">"Layer-3 transparent TUN clients on Android &amp; desktop (Roozaneh)"</tspan>
    </text>
  </g>
</svg>
